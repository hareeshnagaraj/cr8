[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cr8"
version = "0.1.0"
description = "Authenticated music corpus catalog and listening app"
requires-python = ">=3.13"
dependencies = [
  "apsw==3.53.4.0",
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "Jinja2==3.1.6",
  "mediafile>=0.12.0",
  "mutagen>=1.47",
  "Pillow>=11.0",
  "pyacoustid>=1.3.0",
  "python-multipart==0.0.32",
  "pyyaml>=6.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pip-audit==2.10.1",
  "pytest>=8.3",
]
peer = [
  "libp2p>=0.7.0",
]

[project.scripts]
cr8 = "cr8.cli:main"

[tool.setuptools.packages.find]
include = ["cr8*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
